name: Build and release BlinkClip

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a signed release after release prerequisites are configured
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the universal installer contract
        run: |
          python3 replica/scripts/test-release-packaging.py
          python3 replica/scripts/test-update-feed.py
          python3 replica/scripts/test-release-plan.py
      - id: version
        name: Determine whether the package version changed
        env:
          BLINKCLIP_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: python3 replica/scripts/release-plan.py

  intel:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.commit }}
      - name: Compile the Intel app natively
        run: bash replica/scripts/build-app.sh release x86_64
      - name: Verify Intel versions, all executable architectures, and signatures
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: >-
          python3 replica/scripts/release-ci.py verify-intel
          --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"

  release:
    needs: [plan, intel]
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
    concurrency:
      group: blinkclip-release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.commit }}
      - id: existing
        name: Reject conflicting tags and skip an already published release
        run: >-
          python3 replica/scripts/release-ci.py check
          --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Compile, verify, and create a universal macOS DMG
        if: steps.existing.outputs.exists != 'true'
        env:
          BLINKCLIP_UPDATE_PRIVATE_KEY: ${{ secrets.BLINKCLIP_UPDATE_PRIVATE_KEY }}
        run: >-
          python3 replica/scripts/release-ci.py package
          --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Upload verified assets as a draft, then publish
        if: steps.existing.outputs.exists != 'true'
        run: >-
          python3 replica/scripts/release-ci.py publish
          --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      # GITHUB_TOKEN-created releases do not emit another workflow run automatically.
      - name: Update public downloads and deploy the website
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
